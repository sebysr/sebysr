<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sebastiano Manzella - IT Application Owner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="1090" cy="30" r="210" fill="#818cf8" opacity="0.10"/>
    <circle cx="1170" cy="300" r="160" fill="#22d3ee" opacity="0.08"/>

    <text x="1150" y="290" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="210" font-weight="700" fill="#818cf8" opacity="0.07" letter-spacing="-6">SM</text>

    <rect x="72" y="88" width="8" height="136" rx="4" fill="url(#accent)"/>

    <text x="112" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="-1.2">Sebastiano Manzella</text>

    <text x="114" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#a5b4fc" letter-spacing="3.4">IT APPLICATION OWNER</text>

    <text x="114" y="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#94a3b8">Milan, Italy — 10+ years turning business needs into working software</text>
  </g>
</svg>
